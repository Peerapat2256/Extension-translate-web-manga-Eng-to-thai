<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      text-align: left;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      display: block;
    }
    select {
      width: 100%;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    select:focus {
      border-color: #6366f1;
    }
    button {
      background: linear-gradient(135deg, #3b82f6, #7c3aed);
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="title">Manga Translator</div>
  
  <label class="label">โมเดลแปลภาษา (Model)</label>
  <select id="model-select">
    <option value="gemini">Gemini 2.5 Flash (แนะนำ)</option>
    <option value="google_translate">Google Translate Directly</option>
    <option value="llama3:8b">Local: Llama 3 8B (Ollama)</option>
    <option value="gemma2:9b">Local: Gemma 2 9B (Ollama)</option>
    <option value="qwen3:8b">Local: Qwen 3 8B (Ollama)</option>
    <option value="qwen2.5:3b">Local: Qwen 2.5 3B (Ollama)</option>
  </select>

  <button id="translate-btn">แปลหน้านี้ (Translate)</button>
  <script src="popup.js"></script>
</body>
</html>
